<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dodge Ball Arcade - Dynamic Cancel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #07080d;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 680px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.25);
            border-radius: 16px;
            overflow: hidden;
            background: #11131e;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(7, 8, 13, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.2rem;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 900;
        }
        p.subtitle {
            font-size: 0.88rem;
            color: #a0a5c0;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            padding: 14px 38px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #07080d;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
            transition: all 0.15s ease-in-out;
            letter-spacing: 1px;
            outline: none;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.6);
        }
        .btn:active {
            transform: translateY(1px) scale(0.98);
        }
        .leaderboard {
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px;
            margin-top: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .leaderboard h2 {
            font-size: 1rem;
            color: #ff0055;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }
        .ranking-list {
            list-style: none;
            max-height: 170px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ranking-list::-webkit-scrollbar {
            width: 4px;
        }
        .ranking-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .ranking-item:nth-child(1) { color: #ffd700; font-weight: bold; }
        .ranking-item:nth-child(2) { color: #e0e0e0; font-weight: 600; }
        .ranking-item:nth-child(3) { color: #cd7f32; font-weight: 600; }
        .new-record {
            background: rgba(0, 255, 204, 0.25) !important;
            border: 1px solid #00ffcc;
            color: #ffffff !important;
            font-weight: bold;
            animation: pulse-border 1.5s infinite alternate;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 5px rgba(0, 255, 204, 0.3); }
            100% { box-shadow: 0 0 15px rgba(0, 255, 204, 0.8); }
        }
        #hud {
            position: absolute;
            top: 16px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-item {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            color: #ffffff;
        }
        #flip-btn-hint {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 14px;
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid #00ffcc;
            border-radius: 20px;
            color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.05s ease;
        }
        #flip-btn-hint:active {
            transform: scale(0.95);
            background: #00ffcc;
            color: #07080d;
        }
        .controls-hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #838cb3;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="480" height="680"></canvas>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="hud-item" id="score-display">00:00.00</div>
        <div id="flip-btn-hint">SPACE / TAP: CANCEL & FLIP</div>
    </div>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="ui-overlay">
        <h1>DODGE BALL</h1>
        <p class="subtitle">공은 자동으로 좌우 이동합니다.<br>스페이스바 / 터치 입력 시 즉시 캔슬되며<br>반대쪽으로 20~40% 랜덤 급반전합니다!</p>
        <button class="btn" id="start-btn">게임 시작</button>

        <div class="controls-hint">
            ⌨️ 스페이스바 / 📱 터치: 딜레이 없이 즉시 캔슬 & 반대 방향 20~40% 반전<br>
            📱 모바일 최적화: 공 위치 하단 20% 띄움 배치 | 🔻 장애물 -20% 조정
        </div>

        <div class="leaderboard">
            <h2>🏆 TOP 10 랭킹</h2>
            <ul class="ranking-list" id="start-leaderboard"></ul>
        </div>
    </div>

    <!-- Game Over Screen Overlay -->
    <div id="gameover-screen" class="ui-overlay hidden">
        <h1 style="color: #ff0055; text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);">GAME OVER</h1>
        <p class="subtitle" id="final-score">생존 시간: 0.00초</p>
        <button class="btn" id="restart-btn">다시 하기</button>
        
        <div class="leaderboard">
            <h2>🏆 TOP 10 랭킹</h2>
            <ul class="ranking-list" id="gameover-leaderboard"></ul>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreDisplay = document.getElementById('score-display');
const finalScoreDisplay = document.getElementById('final-score');
const startLeaderboard = document.getElementById('start-leaderboard');
const gameoverLeaderboard = document.getElementById('gameover-leaderboard');
const flipBtnHint = document.getElementById('flip-btn-hint');

let gameState = 'START';
let startTime = 0;
let elapsedTime = 0;
let animationFrameId;

// Speed Requirements:
// 1. Initial speed set to 2x faster than standard base (1.2 -> 2.4 base)
// 2. Speed increases by +0.5x every 1 minute (60 seconds)
const BASE_SPEED_2X = 2.4;

let ball = {
    x: canvas.width / 2,
    y: canvas.height * 0.8, // Positioned 20% height above canvas bottom for mobile/responsive safety
    radius: 12,
    dir: 1,                 // 1: Right, -1: Left
    currentSpeed: BASE_SPEED_2X
};

let obstacles = [];
let particles = [];
let ghosts = [];       // Phantom ghost echoes upon movement cancel
let shockwaves = [];   // Dynamic cancel shockwaves
let cancelTexts = [];  // Visual cancellation text indicators
let spawnTimer = 0;
let screenShake = 0;

function getLeaderboard() {
    try {
        const data = localStorage.getItem('dodge_ball_cancel_rankings');
        return data ? JSON.parse(data) : [];
    } catch (e) {
        return [];
    }
}

function saveScore(score) {
    let leaderboard = getLeaderboard();
    const newEntry = { score: score, date: new Date().toLocaleDateString('ko-KR') };
    leaderboard.push(newEntry);
    leaderboard.sort((a, b) => b.score - a.score);
    leaderboard = leaderboard.slice(0, 10);
    try {
        localStorage.setItem('dodge_ball_cancel_rankings', JSON.stringify(leaderboard));
    } catch (e) {}
    return leaderboard;
}

function renderLeaderboard(element, currentScore = null) {
    const leaderboard = getLeaderboard();
    element.innerHTML = '';
    
    if (leaderboard.length === 0) {
        element.innerHTML = '<li class="ranking-item" style="justify-content:center; color:#666;">기록이 없습니다.</li>';
        return;
    }

    let highlighted = false;
    leaderboard.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'ranking-item';
        
        if (currentScore !== null && !highlighted && entry.score === currentScore) {
            li.classList.add('new-record');
            highlighted = true;
        }
        
        li.innerHTML = `
            <span>${index + 1}. ${entry.score.toFixed(2)}초</span>
            <span>${entry.date}</span>
        `;
        element.appendChild(li);
    });
}

function triggerDirectionFlip() {
    if (gameState !== 'PLAYING') return;

    const oldX = ball.x;

    // 1. Instant direction flip with zero input delay
    ball.dir *= -1;

    // 2. Random displacement distance between 20% and 40% of canvas width
    const minDistance = canvas.width * 0.20;
    const maxDistance = canvas.width * 0.40;
    const randomDistance = minDistance + Math.random() * (maxDistance - minDistance);

    // Immediate spatial impulse from current position
    ball.x += ball.dir * randomDistance;

    // Boundary check
    if (ball.x - ball.radius < 0) ball.x = ball.radius;
    if (ball.x + ball.radius > canvas.width) ball.x = canvas.width - ball.radius;

    // 3. Dynamic Visual Cancellation Effects
    screenShake = 8;

    // Phantom echo ghost at exact point of cancellation
    ghosts.push({
        x: oldX,
        y: ball.y,
        radius: ball.radius,
        alpha: 0.9,
        color: '#ff0055'
    });

    // Expanding shockwave ring at cancellation origin
    shockwaves.push({
        x: oldX,
        y: ball.y,
        radius: ball.radius,
        maxRadius: 48,
        lineWidth: 4,
        alpha: 1.0,
        color: '#00ffcc'
    });

    // Directional visual text indicator
    cancelTexts.push({
        text: 'CANCEL!',
        x: oldX,
        y: ball.y - 20,
        alpha: 1.0,
        vy: -1.5
    });

    // Dynamic directional particle explosion
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
            x: oldX,
            y: ball.y,
            vx: Math.cos(angle) * speed + (ball.dir * 4),
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 3.5 + 1,
            color: i % 2 === 0 ? '#00ffcc' : '#ff0055',
            alpha: 1,
            decay: 0.04
        });
    }
}

// Handle border bounce with 20%~70% random rebound distance
function handleWallBounce(wallSide) {
    const oldX = ball.x;

    // Rebound in reverse direction
    ball.dir = wallSide === 'left' ? 1 : -1;

    // Calculate random rebound distance between 20% and 70% of canvas width
    const minDistance = canvas.width * 0.20;
    const maxDistance = canvas.width * 0.70;
    const randomDistance = minDistance + Math.random() * (maxDistance - minDistance);

    ball.x += ball.dir * randomDistance;

    // Boundary check
    if (ball.x - ball.radius < 0) ball.x = ball.radius;
    if (ball.x + ball.radius > canvas.width) ball.x = canvas.width - ball.radius;

    // Wall bounce visual effects
    shockwaves.push({
        x: oldX,
        y: ball.y,
        radius: ball.radius,
        maxRadius: 35,
        lineWidth: 3,
        alpha: 0.9,
        color: '#ff0055'
    });

    screenShake = 5;
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        triggerDirectionFlip();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    triggerDirectionFlip();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
    triggerDirectionFlip();
});

flipBtnHint.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerDirectionFlip();
});

function createExplosion(x, y, count = 90) {
    const colors = ['#00ffcc', '#ff0055', '#ffcc00', '#ffffff', '#ff5500'];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 2;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 4.5 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015
        });
    }
}

function updateEffects() {
    if (screenShake > 0) screenShake *= 0.85;
    if (screenShake < 0.2) screenShake = 0;

    for (let i = ghosts.length - 1; i >= 0; i--) {
        ghosts[i].alpha -= 0.07;
        if (ghosts[i].alpha <= 0) ghosts.splice(i, 1);
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.radius += 3.5;
        sw.alpha -= 0.05;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
    }

    for (let i = cancelTexts.length - 1; i >= 0; i--) {
        let ct = cancelTexts[i];
        ct.y += ct.vy;
        ct.alpha -= 0.04;
        if (ct.alpha <= 0) cancelTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}

function drawEffects() {
    ghosts.forEach(g => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, g.alpha);
        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    shockwaves.forEach(sw => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = sw.lineWidth;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    });

    cancelTexts.forEach(ct => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ct.alpha);
        ctx.font = '900 12px sans-serif';
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.fillText(ct.text, ct.x, ct.y);
        ctx.restore();
    });

    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function spawnObstacle() {
    const size = Math.random() * 14 + 10;
    const x = Math.random() * (canvas.width - size * 2) + size;
    const baseFallSpeed = Math.random() * 2 + 2;
    const speedBoost = Math.min(6, elapsedTime * 0.05); 
    
    obstacles.push({
        x: x,
        y: -size,
        radius: size,
        speed: baseFallSpeed + speedBoost,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        color: '#ff0055'
    });
}

function updateObstacles() {
    // Spawn rate reduced by 20% (interval increased from ~40 frames to ~50 frames)
    const spawnInterval = Math.max(16, Math.floor(50 - elapsedTime * 0.5)); 
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;
        obs.rotation += obs.rotSpeed;

        const dx = ball.x - obs.x;
        const dy = ball.y - obs.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < ball.radius + obs.radius) {
            triggerGameOver();
            return;
        }

        if (obs.y - obs.radius > canvas.height) {
            obstacles.splice(i, 1);
        }
    }
}

function drawObstacles() {
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rotation);
        
        ctx.fillStyle = obs.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = obs.color;
        
        ctx.beginPath();
        const sides = 5;
        for (let i = 0; i < sides; i++) {
            const angle = (i * 2 * Math.PI) / sides;
            const x = Math.cos(angle) * obs.radius;
            const y = Math.sin(angle) * obs.radius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
}

function initGame() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height * 0.8; // 20% height above bottom
    ball.dir = 1;

    obstacles = [];
    particles = [];
    ghosts = [];
    shockwaves = [];
    cancelTexts = [];
    spawnTimer = 0;
    screenShake = 0;

    startTime = performance.now();
    gameState = 'PLAYING';
    
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    
    gameLoop();
}

function update() {
    if (gameState !== 'PLAYING') return;

    elapsedTime = (performance.now() - startTime) / 1000;
    scoreDisplay.innerText = elapsedTime.toFixed(2) + 's';

    // Speed calculation:
    // Initial speed: 2x base speed
    // Increases by 0.5x every 1 minute (60 seconds)
    const minutesElapsed = Math.floor(elapsedTime / 60);
    const currentMultiplier = 1.0 + (minutesElapsed * 0.5);
    ball.currentSpeed = BASE_SPEED_2X * currentMultiplier;

    // Automatic lateral movement
    ball.x += ball.dir * ball.currentSpeed;

    // Wall collision with 20%~70% random recoil bounce
    if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        handleWallBounce('left');
    } else if (ball.x + ball.radius >= canvas.width) {
        ball.x = canvas.width - ball.radius;
        handleWallBounce('right');
    }

    // Motion trail particles
    if (Math.random() < 0.35) {
        particles.push({
            x: ball.x,
            y: ball.y + (Math.random() - 0.5) * 4,
            vx: -ball.dir * 0.5,
            vy: (Math.random() - 0.5) * 1.5,
            radius: Math.random() * 2 + 1,
            color: 'rgba(0, 255, 204, 0.5)',
            alpha: 0.7,
            decay: 0.04
        });
    }

    updateEffects();
    updateObstacles();
}

function draw() {
    ctx.save();

    if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
    }

    // Canvas background
    ctx.fillStyle = '#11131e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    drawEffects();
    drawObstacles();

    // Draw player ball
    if (gameState === 'PLAYING') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00ffcc';
        ctx.fill();
        ctx.restore();
    }

    ctx.restore();
}

function gameLoop() {
    if (gameState === 'PLAYING') {
        update();
        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
    }
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    cancelAnimationFrame(animationFrameId);

    // Multi-directional explosion effect
    createExplosion(ball.x, ball.y, 90);
    
    let frames = 0;
    function particleAnimation() {
        if (frames < 45) {
            ctx.fillStyle = '#11131e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawObstacles();
            updateEffects();
            drawEffects();
            frames++;
            requestAnimationFrame(particleAnimation);
        } else {
            const finalTime = parseFloat(elapsedTime.toFixed(2));
            finalScoreDisplay.innerText = `생존 시간: ${finalTime.toFixed(2)}초`;
            
            saveScore(finalTime);
            renderLeaderboard(gameoverLeaderboard, finalTime);
            gameoverScreen.classList.remove('hidden');
        }
    }
    particleAnimation();
}

startBtn.addEventListener('click', initGame);
restartBtn.addEventListener('click', initGame);

renderLeaderboard(startLeaderboard);
</script>
</body>
</html>
